spring.application.name=proprefact

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Le schéma est géré par Flyway ; Hibernate vérifie seulement qu'il correspond aux entités.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Secret de signature des jetons de connexion : obligatoire, au moins 32 caractères.
app.jwt.secret=${JWT_SECRET}
app.jwt.duree-heures=12
spring.mvc.problemdetails.enabled=true

# Adresse publique du front-end, utilisée dans les liens envoyés par e-mail.
app.url-publique=${APP_URL:http://localhost:4200}
app.mail.expediteur=${MAIL_EXPEDITEUR:no-reply@localhost}
# Envoi des e-mails : sans MAIL_HOST, les messages sont seulement écrits dans le journal (développement).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Limites sur les points d'entrée d'authentification, par fenêtre de 15 minutes.
app.auth.max-requetes-par-ip=30
app.auth.max-echecs-par-email=5
# Relance automatique des dépôts restés en cours, et son intervalle en millisecondes.
app.depot.relance-active=true
app.depot.relance-ms=60000
# Derrière un proxy inverse, nécessaire pour voir la vraie adresse IP du client.
server.forward-headers-strategy=${FORWARD_HEADERS:none}

# Le front-end est servi par cette application (voir config/FrontConfig) : réponses compressées, comme le faisait nginx.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,application/problem+json,image/svg+xml
