spring.application.name=proprefact

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/proprefact}
spring.datasource.username=${DB_USER:proprefact}
spring.datasource.password=${DB_PASSWORD:proprefact}

# Le schéma est géré par Flyway ; Hibernate vérifie seulement qu'il correspond aux entités.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Secret de signature des jetons de connexion : obligatoire, au moins 32 caractères.
app.jwt.secret=${JWT_SECRET}
app.jwt.duree-heures=12
spring.mvc.problemdetails.enabled=true
