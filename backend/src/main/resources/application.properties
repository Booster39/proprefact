spring.application.name=proprefact
# Port d'écoute : variable PORT si l'hébergeur la fournit ; 8080 sinon (port attendu par Clever Cloud).
server.port=${PORT:8080}

# Base PostgreSQL : DB_URL (jdbc), DB_USER, DB_PASSWORD ; à défaut, les variables que le module PostgreSQL de
# Clever Cloud donne à l'application qui lui est liée (POSTGRESQL_ADDON_HOST, _PORT, _DB, _USER, _PASSWORD). Sans
# l'un ni l'autre, l'application refuse de démarrer : aucun identifiant par défaut en production.
spring.datasource.url=${DB_URL:jdbc:postgresql://${POSTGRESQL_ADDON_HOST}:${POSTGRESQL_ADDON_PORT:5432}/${POSTGRESQL_ADDON_DB}}
spring.datasource.username=${DB_USER:${POSTGRESQL_ADDON_USER}}
spring.datasource.password=${DB_PASSWORD:${POSTGRESQL_ADDON_PASSWORD}}

# Le schéma est géré par Flyway ; Hibernate vérifie seulement qu'il correspond aux entités.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Secret de signature des jetons de connexion : obligatoire, au moins 32 caractères.
app.jwt.secret=${JWT_SECRET}
app.jwt.duree-heures=12
spring.mvc.problemdetails.enabled=true

# Adresse publique du front-end, utilisée dans les liens envoyés par e-mail.
app.url-publique=${APP_URL:http://localhost:4200}
app.mail.expediteur=${MAIL_EXPEDITEUR:no-reply@localhost}
# Envoi des e-mails : sans MAIL_HOST, les messages sont seulement écrits dans le journal (développement).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Limites sur les points d'entrée d'authentification, par fenêtre de 15 minutes.
app.auth.max-requetes-par-ip=30
app.auth.max-echecs-par-email=5
# Relance automatique des dépôts restés en cours, et son intervalle en millisecondes.
app.depot.relance-active=true
app.depot.relance-ms=60000
# Adresse IP du client, pour la limite par IP. Derrière le proxy de Clever Cloud :
# ENTETE_IP_CLIENT=X-Forwarded-For, dont seule la dernière adresse, ajoutée par ce proxy, est lue (voir
# web/AdresseClient et DEPLOIEMENT-CLEVER-CLOUD.md). Vide : adresse de la connexion.
app.auth.entete-ip-client=${ENTETE_IP_CLIENT:}
# X-Forwarded-For n'est jamais lu : Spring en prendrait la première adresse, que le client peut inventer.
# « none » explicite, pour que Spring ne l'active pas de lui-même s'il croit reconnaître un hébergeur.
server.forward-headers-strategy=none

# Le front-end est servi par cette application (voir config/FrontConfig) : réponses compressées, comme le faisait nginx.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,application/problem+json,image/svg+xml

# Vérification de santé (Clever Cloud l'appelle à chaque déploiement) : /actuator/health, sans détail, seul point.
# Elle vérifie que l'application a démarré et joint la base. Le serveur d'e-mails n'en fait pas partie : une panne
# du fournisseur SMTP ne doit pas empêcher une mise à jour de l'application.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=false
management.health.mail.enabled=false
