# Sert l'application Angular et relaie l'API vers le conteneur du back-end.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # nginx n'hérite pas des add_header d'un niveau supérieur dès qu'un bloc en déclare un :
    # ces en-têtes sont donc répétés dans chaque bloc location ci-dessous.

    # DNS interne de Docker. Avec une variable dans proxy_pass, nginx résout « backend » à chaque
    # requête (au plus toutes les 10 s) au lieu d'une seule fois au démarrage : un back-end recréé
    # avec une nouvelle adresse (mise à jour) reste joignable sans redémarrer nginx.
    # Hors de Docker Compose (Kubernetes…), remplacer 127.0.0.11 par le DNS de la plateforme.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        # Le back-end limite les tentatives de connexion par adresse IP et lit cette adresse dans
        # X-Forwarded-For (FORWARD_HEADERS=framework). nginx est le point d'entrée : il REMPLACE
        # l'en-tête par l'adresse réelle. Le compléter ($proxy_add_x_forwarded_for) laisserait un
        # attaquant inventer une adresse à chaque requête et contourner la limite.
        # Si un autre proxy est placé devant nginx (répartiteur de charge de l'hébergeur), utiliser
        # le module real_ip de nginx pour retrouver l'adresse du client, jamais l'en-tête brut.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Fichiers dont le nom change à chaque version : ils peuvent rester longtemps en cache.
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Toute autre adresse (/factures, /confirmation?jeton=…) est une page de l'application.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
}
