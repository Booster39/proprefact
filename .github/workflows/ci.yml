name: CI
on:
  push:
    branches: [main, railway]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npx ng build

  # Image unique (Dockerfile de la racine), celle que construit Railway : front compilé, jar, image finale.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Construction complète du Dockerfile
        run: docker build -t proprefact .
      # Image lancée contre PostgreSQL 16 (tests) puis 18 (version de Railway) : accueil, API protégée,
      # inscription, confirmation, facture validée, Factur-X.
      - name: Essai de bout en bout, PostgreSQL 16
        run: SANS_CONSTRUCTION=1 ./deploiement/essai.sh
      - name: Essai de bout en bout, PostgreSQL 18
        run: SANS_CONSTRUCTION=1 POSTGRES_VERSION=18 ./deploiement/essai.sh
